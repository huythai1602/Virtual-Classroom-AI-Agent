name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - feature/test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/langgraph-agent:latest
            ${{ secrets.DOCKER_USERNAME }}/langgraph-agent:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/langgraph-agent:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/langgraph-agent:cache,mode=max
      
      - name: Trigger Render Deploy
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/test'
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
